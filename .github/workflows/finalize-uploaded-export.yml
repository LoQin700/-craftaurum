name: Finalize uploaded Shopify export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-uploaded-export.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Shopify export normalization
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          diff_path = Path('.compare/diff.json')
          diff = json.loads(diff_path.read_text(encoding='utf-8'))
          changed = diff.get('changed', [])

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          for path in changed:
              p = Path(path)
              if not p.exists():
                  continue
              text = read(path)

              if path.endswith('.liquid') and (path.startswith('blocks/') or path.startswith('sections/')):
                  text = text.lstrip('\n')
                  text = '\n\n' + text
                  write(path, text)
                  continue

              if path == 'config/settings_data.json':
                  text = re.sub(r'^/\*.*?\*/\s*', '', text, flags=re.S)
                  data = json.loads(text)
                  write(path, json.dumps(data, separators=(',', ':'), ensure_ascii=False))
                  continue

              if path == 'config/settings_schema.json':
                  write(path, text.rstrip('\n'))
                  continue

              if path.endswith('.json') and path.startswith('templates/'):
                  text = text.replace('*/\n{', '*/{')
                  write(path, text.rstrip('\n'))
                  continue

              if path.endswith('.json') and path.startswith('sections/'):
                  write(path, text)
                  continue
          PY

      - name: Verify against uploaded export manifest
        shell: bash
        run: |
          cat .compare/manifest-* > /tmp/uploaded.manifest
          find assets blocks config layout locales sections snippets templates -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > /tmp/current.manifest
          python3 - <<'PY'
          from pathlib import Path
          import json
          def load(path):
              result = {}
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  digest, filename = line.split('  ', 1)
                  result[filename] = digest
              return result
          uploaded = load('/tmp/uploaded.manifest')
          current = load('/tmp/current.manifest')
          changed = sorted(p for p in uploaded.keys() & current.keys() if uploaded[p] != current[p])
          missing = sorted(uploaded.keys() - current.keys())
          extra = sorted(current.keys() - uploaded.keys())
          result = {'changed': changed, 'missing': missing, 'extra': extra, 'uploaded_file_count': len(uploaded), 'repo_file_count': len(current)}
          print(json.dumps(result, indent=2))
          if changed or missing or extra:
              raise SystemExit('Uploaded export verification failed')
          PY

      - name: Clean helper files and commit
        shell: bash
        run: |
          rm -rf .compare .upload
          rm -f .github/workflows/finalize-uploaded-export.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize uploaded Horizon 4.1.3 export"
          git push origin main
