name: Validate 35px Titles and Reveal

on:
  push:
    branches:
      - fix/title-35-and-reveal

permissions:
  contents: read
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate title defaults and reveal wiring
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          section_files = [
            'sections/content-cards.liquid',
            'sections/overlap-image-text.liquid',
            'sections/interactive-feature.liquid',
            'sections/process-cards.liquid',
            'sections/image-text-feature.liquid',
            'sections/image-cards.liquid',
            'sections/comparison-table.liquid',
            'sections/content-guide.liquid',
            'sections/why-choose-craftaurum.liquid',
            'sections/editorial-contact.liquid',
          ]

          for filename in section_files:
              text = Path(filename).read_text(encoding='utf-8')
              schema_text = text.split('{% schema %}',1)[1].split('{% endschema %}',1)[0].strip()
              schema = json.loads(schema_text)
              heading = next((s for s in schema.get('settings',[]) if s.get('id') == 'heading_size'), None)
              assert heading is not None, filename
              assert heading.get('default') == 35, (filename, heading.get('default'))
              assert heading.get('step') == 1, (filename, heading.get('step'))

          pearl_text = Path('templates/page.pearl-jewelry.json').read_text(encoding='utf-8')
          pearl = json.loads(pearl_text[pearl_text.index('{'):])
          assert pearl['sections']['pearl_intro']['settings']['heading_size'] != 35
          for sid in ['pearl_types','pearl_business','pearl_products','pearl_process','pearl_why','contact']:
              assert pearl['sections'][sid]['settings']['heading_size'] == 35, sid

          js = Path('assets/craftaurum-reveal.js').read_text(encoding='utf-8')
          css = Path('assets/craftaurum-reveal.css').read_text(encoding='utf-8')
          assert js.count('requestAnimationFrame') >= 6
          assert "shopify:section:select" in js
          assert "shopify:section:load" in js
          assert 'threshold: 0.14' in js
          assert '--ca-reveal-duration: 780ms' in css
          assert 'translate3d(0, 28px, 0)' in css
          assert 'scale(.96)' in css

          print('35px title and reveal validation: PASS')
          PY

      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
