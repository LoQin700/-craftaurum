name: Validate Content Guide

on:
  push:
    branches:
      - refactor/content-guide-original-layout

permissions:
  contents: read
  checks: write

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate template structure
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          text = Path('templates/page.solid-gold.json').read_text(encoding='utf-8')
          page = json.loads(text[text.index('{'):])
          guide = page['sections']['indexed_guide']
          assert guide['type'] == 'content-guide'
          assert guide['name'] == '内容指南'
          assert len(guide['block_order']) == 5
          assert 'index_aria_label' not in guide['settings']
          print('Content guide template structure: PASS')
          PY
      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
