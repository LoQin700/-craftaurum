name: Validate Guide Comparison Polish

on:
  push:
    branches:
      - refactor/guide-comparison-polish

permissions:
  contents: read
  checks: write

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate template settings
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ['page.gold-vermeil.json','page.solid-gold.json']:
              text=Path('templates',name).read_text(encoding='utf-8')
              page=json.loads(text[text.index('{'):])
              for sec in page['sections'].values():
                  if sec.get('type')=='content-guide':
                      assert sec['settings']['item_padding_inline']==20
                  if sec.get('type')=='comparison-table':
                      assert sec['settings']['header_background']=='#F3EEE3'
                      assert sec['settings']['hover_background']=='#F8F2E5'
          print('Guide/comparison defaults: PASS')
          PY
      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
