name: Validate Content Cards Size Align

on:
  push:
    branches:
      - feature/content-cards-size-align

permissions:
  contents: read
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate settings and CSS wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('sections/content-cards.liquid').read_text(encoding='utf-8')
          assert '"id": "image_width"' in text
          assert '"min": 10' in text
          assert '"id": "card_text_alignment"' in text
          assert '--ca-cards-card-align:' in text
          assert '--ca-cards-card-action-align:' in text
          assert 'text-align: var(--ca-cards-card-align);' in text
          assert 'justify-content: var(--ca-cards-card-action-align);' in text
          assert 'text-align: center;' not in text.split('.ca-content-cards--process .ca-content-card__content',1)[1].split('}',1)[0]
          print('Content cards size/alignment wiring: PASS')
          PY

      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
