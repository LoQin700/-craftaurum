name: Validate Craftaurum Section Audit V3

on:
  push:
    branches:
      - refactor/craftaurum-section-audit-v3

permissions:
  contents: read
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate custom sections, page templates and contacts
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          custom_types = {
            'brand-partners',
            'comparison-table',
            'content-cards',
            'content-guide',
            'editorial-contact',
            'festival-intro',
            'horizontal-cta',
            'icon-text-list',
            'icon-with-text',
            'image-cards',
            'image-collection-grid',
            'image-gallery',
            'image-text-feature',
            'interactive-feature',
            'jewelry-collections-overview',
            'overlap-image-text',
            'process-cards',
            'text-heading',
            'triptych-split-rows',
            'why-choose-craftaurum',
          }

          schemas = {}
          def load_schema(stype):
              if stype in schemas:
                  return schemas[stype]
              path = Path('sections') / f'{stype}.liquid'
              text = path.read_text(encoding='utf-8')
              schema_text = text.split('{% schema %}',1)[1].split('{% endschema %}',1)[0].strip()
              schemas[stype] = json.loads(schema_text)
              return schemas[stype]

          errors = []

          # Section-level V3 standards.
          no_heading_required = {'image-gallery'}
          banner_type = 'jewelry-collections-overview'
          legacy_hidden = {'icon-text-list'}

          for stype in sorted(custom_types):
              schema = load_schema(stype)
              text = (Path('sections') / f'{stype}.liquid').read_text(encoding='utf-8')
              defs = {s.get('id'): s for s in schema.get('settings',[]) if isinstance(s,dict) and s.get('id')}

              if stype not in no_heading_required:
                  hs = defs.get('heading_size')
                  if stype == banner_type:
                      if not hs or hs.get('default') != 58:
                          errors.append(f'{stype}: banner heading default must remain 58')
                  elif stype not in legacy_hidden:
                      if not hs or hs.get('default') != 35:
                          errors.append(f'{stype}: heading_size default must be 35')

              if stype not in {'image-gallery'} and stype not in legacy_hidden:
                  if 'animation_style' not in defs:
                      errors.append(f'{stype}: missing animation_style')
                  if 'data-ca-reveal' not in text:
                      errors.append(f'{stype}: missing data-ca-reveal')

              forbidden = {'heading_preset','body_preset','eyebrow_preset','description_preset','disclaimer_preset','item_title_preset','card_title_preset'}
              found = forbidden & set(defs)
              if found:
                  errors.append(f'{stype}: legacy typography settings remain: {sorted(found)}')

          # Non-gallery image-hover cleanup checks.
          hover_forbidden = {
            'image-cards': [
              r'hover_overlay_opacity',
              r'\.ca-image-card:hover\s+\.ca-image-card__image',
              r'transform:\s*scale\('
            ],
            'image-collection-grid': [
              r'hover_overlay_opacity',
              r'ca-hover-overlay',
              r'\.ca-collection__card:is\(:hover[^\n]*\.ca-collection__image',
              r'transform:\s*scale\('
            ],
            'process-cards': [
              r'\.ca-process-card:hover\s+\.ca-process-card__image',
              r'\.ca-process-card:hover\s+\.ca-process-card__media'
            ],
            'interactive-feature': [
              r'transform:\s*scale\('
            ],
          }
          for stype, patterns in hover_forbidden.items():
              text = (Path('sections') / f'{stype}.liquid').read_text(encoding='utf-8')
              for pattern in patterns:
                  if re.search(pattern, text):
                      errors.append(f'{stype}: forbidden image hover/scale pattern {pattern}')

          # Validate all templates that use our custom sections.
          for path in sorted(Path('templates').glob('*.json')):
              raw = path.read_text(encoding='utf-8')
              try:
                  data = json.loads(raw[raw.index('{'):])
              except Exception as exc:
                  errors.append(f'{path}: JSON parse error: {exc}')
                  continue

              for sid, sec in data.get('sections',{}).items():
                  stype = sec.get('type')
                  if stype not in custom_types:
                      continue
                  schema = load_schema(stype)
                  defs = {s.get('id'): s for s in schema.get('settings',[]) if isinstance(s,dict) and s.get('id')}

                  for key, value in sec.get('settings',{}).items():
                      spec = defs.get(key)
                      if spec is None:
                          errors.append(f'{path}:{sid}.{key}: setting not in {stype} schema')
                          continue
                      if spec.get('type') == 'range':
                          lo, hi, step = spec['min'], spec['max'], spec['step']
                          if value < lo or value > hi:
                              errors.append(f'{path}:{sid}.{key}={value} outside {lo}..{hi}')
                          else:
                              q = (value - lo) / step
                              if abs(q - round(q)) > 1e-9:
                                  errors.append(f'{path}:{sid}.{key}={value} not aligned to step {step} from {lo}')
                      elif spec.get('type') == 'select':
                          allowed = {o['value'] for o in spec.get('options',[])}
                          if value not in allowed:
                              errors.append(f'{path}:{sid}.{key}={value!r} not in {sorted(allowed)}')

                  block_defs = {
                      b.get('type'): {s.get('id'):s for s in b.get('settings',[]) if isinstance(s,dict) and s.get('id')}
                      for b in schema.get('blocks',[]) if isinstance(b,dict) and b.get('type')
                  }
                  for bid, block in sec.get('blocks',{}).items():
                      btype = block.get('type')
                      defs_b = block_defs.get(btype)
                      if defs_b is None:
                          continue
                      for key, value in block.get('settings',{}).items():
                          spec = defs_b.get(key)
                          if spec is None:
                              errors.append(f'{path}:{sid}.{bid}.{key}: block setting not in {stype}/{btype} schema')
                              continue
                          if spec.get('type') == 'range':
                              lo, hi, step = spec['min'], spec['max'], spec['step']
                              if value < lo or value > hi:
                                  errors.append(f'{path}:{sid}.{bid}.{key}={value} outside {lo}..{hi}')
                              else:
                                  q = (value - lo) / step
                                  if abs(q - round(q)) > 1e-9:
                                      errors.append(f'{path}:{sid}.{bid}.{key}={value} not aligned to step {step} from {lo}')
                          elif spec.get('type') == 'select':
                              allowed = {o['value'] for o in spec.get('options',[])}
                              if value not in allowed:
                                  errors.append(f'{path}:{sid}.{bid}.{key}={value!r} not in {sorted(allowed)}')

          # All custom page contacts should now use Editorial Contact, never native contact-form.
          custom_pages = [
            'page.contact.json',
            'page.custom-silver-jewelry.json',
            'page.customization.json',
            'page.festival-jewelry.json',
            'page.gold-plated.json',
            'page.gold-vermeil.json',
            'page.jewelry-artisanal.json',
            'page.jewelry-bracelets.json',
            'page.jewelry-collections.json',
            'page.jewelry-earrings.json',
            'page.jewelry-fashion.json',
            'page.jewelry-necklace.json',
            'page.jewelry-rings.json',
            'page.oem-jewellery.json',
            'page.pearl-jewelry.json',
            'page.solid-gold.json',
          ]
          for filename in custom_pages:
              path = Path('templates') / filename
              raw = path.read_text(encoding='utf-8')
              data = json.loads(raw[raw.index('{'):])
              native = []
              editorial = []
              for sid, sec in data.get('sections',{}).items():
                  if sec.get('type') == 'editorial-contact':
                      editorial.append(sid)
                  if any(b.get('type') == 'contact-form' for b in sec.get('blocks',{}).values()):
                      native.append(sid)
              if native:
                  errors.append(f'{filename}: native contact-form remains: {native}')
              if len(editorial) != 1:
                  errors.append(f'{filename}: expected 1 editorial-contact, found {editorial}')
              elif data.get('order',[])[-1] != editorial[0]:
                  errors.append(f'{filename}: editorial-contact is not the last section')

          if errors:
              print('\n'.join(errors))
              raise SystemExit(f'Validation failed with {len(errors)} issue(s)')

          print('Craftaurum V3 section/template/contact validation: PASS')
          PY

      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
