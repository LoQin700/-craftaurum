name: Diagnose Theme Check V2

on:
  push:
    branches:
      - refactor/craftaurum-v2-sections

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install Theme Check
        run: gem install theme-check --no-document
      - name: Run Theme Check
        shell: bash
        run: |
          set +e
          theme-check . --fail-level error > theme-check-output.txt 2>&1
          cat theme-check-output.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: theme-check-output
          path: theme-check-output.txt
