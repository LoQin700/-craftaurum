name: Validate Customization

on:
  push:
    branches:
      - fix/customization-current-main

permissions:
  contents: read
  checks: write

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Customization JSON structure
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          def load_json_template(path):
              text = Path(path).read_text(encoding='utf-8')
              text = re.sub(r'^/\\*.*?\\*/\\s*', '', text, flags=re.S)
              return json.loads(text)

          page = load_json_template('templates/page.customization.json')
          expected = [
              'main',
              'custom_hero',
              'capabilities',
              'craft_casting',
              'craft_polishing',
              'craft_private_label',
              'process_cards',
              'contact',
          ]
          assert page['order'] == expected, page['order']
          assert page['sections']['custom_hero']['type'] == 'slideshow'
          assert page['sections']['custom_hero']['blocks']['slide_1']['type'] == '_slide'
          assert page['sections']['capabilities']['type'] == 'image-cards'
          assert len(page['sections']['capabilities']['block_order']) == 5
          assert page['sections']['process_cards']['settings']['card_style'] == 'process'
          assert page['sections']['process_cards']['settings']['desktop_columns'] == '3'
          assert page['sections']['process_cards']['settings']['mobile_layout'] == 'carousel'
          print('Customization template structure: PASS')
          PY
      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
