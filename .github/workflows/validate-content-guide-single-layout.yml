name: Validate Content Guide Single Layout

on:
  push:
    branches:
      - refactor/content-guide-single-intro

permissions:
  contents: read
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Content Guide single layout
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          liquid=Path('sections/content-guide.liquid').read_text(encoding='utf-8')
          schema=json.loads(liquid.split('{% schema %}',1)[1].split('{% endschema %}',1)[0].strip())
          ids={s.get('id') for s in schema.get('settings',[]) if isinstance(s,dict)}

          assert 'intro_style' not in ids
          assert 'item_layout' not in ids
          assert 'intro_alignment' in ids
          assert 'show_index' in ids
          assert 'ca-content-guide__intro--style_1' not in liquid
          assert 'ca-content-guide__intro--style_2' not in liquid
          assert 'ca-content-guide__item-layout--style_1' not in liquid
          assert 'ca-content-guide__item-layout--style_2' not in liquid

          text=Path('templates/page.festival-jewelry.json').read_text(encoding='utf-8')
          page=json.loads(text[text.index('{'):])
          settings=page['sections']['customization_guide']['settings']
          assert 'intro_style' not in settings
          assert 'item_layout' not in settings

          defs={s.get('id'):s for s in schema.get('settings',[]) if isinstance(s,dict) and s.get('id')}
          errors=[]
          for key,value in settings.items():
              spec=defs.get(key)
              if not spec:
                  continue
              if spec.get('type')=='range':
                  lo,hi,step=spec['min'],spec['max'],spec['step']
                  if value < lo or value > hi:
                      errors.append(f'{key}={value} outside {lo}..{hi}')
                  else:
                      q=(value-lo)/step
                      if abs(q-round(q)) > 1e-9:
                          errors.append(f'{key}={value} not aligned to step {step} from min {lo}')
              elif spec.get('type')=='select':
                  allowed={o['value'] for o in spec.get('options',[])}
                  if value not in allowed:
                      errors.append(f'{key}={value!r} not in {sorted(allowed)}')
          assert not errors, '\n'.join(errors)

          print('Content Guide single-layout validation: PASS')
          PY

      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
