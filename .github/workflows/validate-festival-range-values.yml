name: Validate Festival Range Values

on:
  push:
    branches:
      - fix/festival-template-range-values

permissions:
  contents: read
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate template values against section schemas
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load_json_with_header(path):
              text=Path(path).read_text(encoding='utf-8')
              return json.loads(text[text.index('{'):])

          page=load_json_with_header('templates/page.festival-jewelry.json')

          schema_cache={}
          def section_schema(section_type):
              if section_type in schema_cache:
                  return schema_cache[section_type]
              p=Path('sections')/(section_type+'.liquid')
              text=p.read_text(encoding='utf-8')
              schema=json.loads(text.split('{% schema %}',1)[1].split('{% endschema %}',1)[0].strip())
              schema_cache[section_type]=schema
              return schema

          errors=[]
          for sid,sec in page['sections'].items():
              stype=sec.get('type')
              if not stype or stype=='main-page':
                  continue
              schema=section_schema(stype)
              setting_defs={s.get('id'):s for s in schema.get('settings',[]) if s.get('id')}
              for key,value in sec.get('settings',{}).items():
                  spec=setting_defs.get(key)
                  if not spec:
                      continue
                  if spec.get('type')=='range':
                      lo,hi,step=spec['min'],spec['max'],spec['step']
                      if value < lo or value > hi:
                          errors.append(f'{sid}.{key}={value} outside {lo}..{hi}')
                      else:
                          q=(value-lo)/step
                          if abs(q-round(q)) > 1e-9:
                              errors.append(f'{sid}.{key}={value} not aligned to step {step} from min {lo}')
                  elif spec.get('type')=='select':
                      allowed={o['value'] for o in spec.get('options',[])}
                      if value not in allowed:
                          errors.append(f'{sid}.{key}={value!r} not in {sorted(allowed)}')

              block_defs={b['type']:{s.get('id'):s for s in b.get('settings',[]) if s.get('id')} for b in schema.get('blocks',[])}
              for bid,block in sec.get('blocks',{}).items():
                  defs=block_defs.get(block.get('type'),{})
                  for key,value in block.get('settings',{}).items():
                      spec=defs.get(key)
                      if not spec:
                          continue
                      if spec.get('type')=='range':
                          lo,hi,step=spec['min'],spec['max'],spec['step']
                          if value < lo or value > hi:
                              errors.append(f'{sid}.{bid}.{key}={value} outside {lo}..{hi}')
                          else:
                              q=(value-lo)/step
                              if abs(q-round(q)) > 1e-9:
                                  errors.append(f'{sid}.{bid}.{key}={value} not aligned to step {step} from min {lo}')

          assert not errors, '\n'.join(errors)
          print('Festival template schema range/select validation: PASS')
          PY

      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
