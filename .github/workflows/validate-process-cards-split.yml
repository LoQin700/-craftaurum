name: Validate Process Cards Split

on:
  push:
    branches:
      - refactor/process-cards-section

permissions:
  contents: read
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate split and migration
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          content_cards=Path('sections/content-cards.liquid').read_text(encoding='utf-8')
          process_cards=Path('sections/process-cards.liquid').read_text(encoding='utf-8')
          customization=Path('templates/page.customization.json').read_text(encoding='utf-8')

          assert '"id": "card_style"' not in content_cards
          assert 'ca-content-cards--process' not in content_cards
          assert '"name": "流程卡片"' in process_cards
          assert '"type": "step"' in process_cards

          page=json.loads(customization[customization.index('{'):])
          sec=page['sections']['process_cards']
          assert sec['type']=='process-cards'
          assert sec['name']=='流程卡片'
          assert sec['block_order']==[
            'communication','design','rendering','sampling','production','delivery'
          ]
          assert sec['settings']['desktop_columns']=='3'
          assert sec['settings']['mobile_layout']=='carousel'
          assert sec['settings']['image_ratio']=='landscape'

          for bid in sec['block_order']:
              block=sec['blocks'][bid]
              assert block['type']=='step'
              assert block['settings']['image'].startswith('shopify://shop_images/')
              assert block['settings']['title']
              assert block['settings']['description']

          # No remaining template should request the removed process card style.
          for p in Path('templates').glob('*.json'):
              txt=p.read_text(encoding='utf-8')
              assert '"card_style": "process"' not in txt, p

          print('Process cards split/migration: PASS')
          PY

      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
