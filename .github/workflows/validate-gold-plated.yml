name: Validate Gold Plated Page

on:
  push:
    branches:
      - feature/gold-plated-page

permissions:
  contents: read
  checks: write

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gold Plated template structure
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          text=Path('templates/page.gold-plated.json').read_text(encoding='utf-8')
          page=json.loads(text[text.index('{'):])
          expected=['main','intro_rich_text','plating_colors','plating_capability','why_choose','plating_guide','plated_compare','contact']
          assert page['order']==expected
          assert page['sections']['plating_colors']['type']=='content-cards'
          assert len(page['sections']['plating_colors']['block_order'])==6
          assert page['sections']['plating_capability']['type']=='image-text-feature'
          assert page['sections']['plating_guide']['type']=='content-guide'
          assert len(page['sections']['plating_guide']['block_order'])==3
          assert page['sections']['plated_compare']['type']=='comparison-table'
          assert len(page['sections']['plated_compare']['block_order'])==6
          assert page['sections']['why_choose']['type']=='section'
          print('Gold Plated template structure: PASS')
          PY
      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
