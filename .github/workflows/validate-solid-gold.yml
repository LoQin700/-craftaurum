name: Validate Solid Gold Page

on:
  push:
    branches:
      - feature/solid-gold-page

permissions:
  contents: read
  checks: write

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Solid Gold template structure
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          text = Path('templates/page.solid-gold.json').read_text(encoding='utf-8')
          page = json.loads(text[text.index('{'):])
          expected = [
              'main','solid_gold_intro','gold_showcase','custom_gold','gold_vermeil',
              'low_moq_gold','material_compare','gold_colors','karat_guide',
              'jewelry_types','contact'
          ]
          assert page['order'] == expected
          assert page['sections']['material_compare']['type'] == 'gold-material-comparison'
          assert len(page['sections']['material_compare']['block_order']) == 3
          assert page['sections']['gold_colors']['type'] == 'section'
          assert len(page['sections']['gold_colors']['block_order']) == 3
          assert page['sections']['karat_guide']['type'] == 'gold-karat-guide'
          assert len(page['sections']['karat_guide']['block_order']) == 5
          assert len(page['sections']['jewelry_types']['block_order']) == 6
          print('Solid Gold template structure: PASS')
          PY
      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
