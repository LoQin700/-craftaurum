name: Validate Gold Plated Durability Layout

on:
  push:
    branches:
      - refactor/gold-plated-durability-layout

permissions:
  contents: read
  checks: write

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate template structure
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          text=Path('templates/page.gold-plated.json').read_text(encoding='utf-8')
          page=json.loads(text[text.index('{'):])
          assert 'plating_guide' not in page['sections']
          assert page['sections']['plating_durability_story']['type']=='section'
          assert page['sections']['plating_process_gallery']['type']=='section'
          assert page['sections']['plating_durability_story']['block_order']==['story_copy','story_image']
          assert page['sections']['plating_process_gallery']['block_order']==['gallery_1','gallery_2','gallery_3']
          assert 'plating_durability_story' in page['order']
          assert 'plating_process_gallery' in page['order']
          print('Gold plated durability layout: PASS')
          PY
      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
