name: Validate Contact Rollout

on:
  push:
    branches: [fix/contact-unification-latest-main]

permissions:
  contents: read
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check page contacts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          pages=[
            'page.contact.json','page.custom-silver-jewelry.json','page.customization.json',
            'page.festival-jewelry.json','page.gold-plated.json','page.gold-vermeil.json',
            'page.jewelry-artisanal.json','page.jewelry-bracelets.json','page.jewelry-collections.json',
            'page.jewelry-earrings.json','page.jewelry-fashion.json','page.jewelry-necklace.json',
            'page.jewelry-rings.json','page.oem-jewellery.json','page.pearl-jewelry.json',
            'page.solid-gold.json'
          ]
          for name in pages:
              p=Path('templates')/name
              raw=p.read_text(encoding='utf-8')
              data=json.loads(raw[raw.index('{'):])
              native=[]
              editorial=[]
              for sid,sec in data.get('sections',{}).items():
                  if sec.get('type')=='editorial-contact':
                      editorial.append(sid)
                  if any(b.get('type')=='contact-form' for b in sec.get('blocks',{}).values()):
                      native.append(sid)
              assert not native,(name,native)
              assert len(editorial)==1,(name,editorial)
              assert data['order'][-1]==editorial[0],(name,data['order'][-1],editorial)
          print('Contact rollout: PASS')
          PY
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
