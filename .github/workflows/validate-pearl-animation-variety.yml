name: Validate Pearl Animation Variety

on:
  push:
    branches:
      - tweak/pearl-animation-variety

permissions:
  contents: read
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Pearl animation sequence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          text=Path('templates/page.pearl-jewelry.json').read_text(encoding='utf-8')
          page=json.loads(text[text.index('{'):])
          expected={
            'pearl_intro':'fade-in',
            'pearl_types':'fade-up',
            'pearl_business':'soft-zoom',
            'pearl_products':'fade-in',
            'pearl_process':'fade-up',
            'pearl_why':'fade-in',
            'contact':'fade-up'
          }
          actual={k:page['sections'][k]['settings']['animation_style'] for k in expected}
          assert actual==expected,(actual,expected)
          print('Pearl animation variety: PASS')
          PY

      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
