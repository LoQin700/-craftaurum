name: Validate Editorial Contact Required Fields

on:
  push:
    branches:
      - fix/editorial-contact-width-required

permissions:
  contents: read
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Editorial Contact logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('sections/editorial-contact.liquid').read_text(encoding='utf-8')

          assert 'max-width:13ch' not in text
          assert 'max-width:none' in text

          assert 'contact[name]' in text and 'autocomplete="name" required' in text
          assert 'contact[email]' in text and 'autocomplete="email" required' in text
          assert 'contact[company]' in text and 'autocomplete="organization" required' in text
          assert 'contact[body]' in text and '<textarea name="contact[body]" required>' in text

          assert 'Name <small class="ca-editorial-contact__required"' in text
          assert 'Email <small class="ca-editorial-contact__required"' in text
          assert 'Company <small class="ca-editorial-contact__required"' in text
          assert 'Tell us about your project <small class="ca-editorial-contact__required"' in text

          assert "section.settings.phone_required" in text
          assert 'font-size:9px' in text

          print('Editorial Contact required-field validation: PASS')
          PY

      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
