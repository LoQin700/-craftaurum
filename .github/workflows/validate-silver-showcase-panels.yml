name: Validate Silver Showcase Panels

on:
  push:
    branches:
      - refactor/silver-showcase-swap-backgrounds

permissions:
  contents: read
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate showcase panel structure
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          text=Path('templates/page.custom-silver-jewelry.json').read_text(encoding='utf-8')
          page=json.loads(text[text.index('{'):])
          sec=page['sections']['silver_showcase_rows']

          for rid in sec['block_order']:
              row=sec['blocks'][rid]
              first,second=row['block_order']
              assert first.endswith('_copy'), (rid,row['block_order'])
              assert second.endswith('_images'), (rid,row['block_order'])

              copy=row['blocks'][first]['settings']
              images=row['blocks'][second]['settings']

              assert copy['background_color']=='#E7DED0'
              assert images['background_color']=='#F6F2EB'
              assert copy['padding-inline-start']==32
              assert copy['padding-inline-end']==32
              assert images['padding-inline-start']==18
              assert images['padding-inline-end']==18

          print('Silver showcase panel structure: PASS')
          PY

      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
