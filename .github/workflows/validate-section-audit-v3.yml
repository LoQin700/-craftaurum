name: Validate Craftaurum Section Audit V3

on:
  push:
    branches:
      - refactor/craftaurum-section-audit-v3

permissions:
  contents: read
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Craftaurum custom sections and templates
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          custom_types = {
            'brand-partners',
            'comparison-table',
            'content-cards',
            'content-guide',
            'editorial-contact',
            'festival-intro',
            'horizontal-cta',
            'icon-text-list',
            'icon-with-text',
            'image-cards',
            'image-collection-grid',
            'image-gallery',
            'image-text-feature',
            'interactive-feature',
            'jewelry-collections-overview',
            'overlap-image-text',
            'process-cards',
            'text-heading',
            'triptych-split-rows',
            'why-choose-craftaurum',
          }

          no_heading_required = {'image-gallery'}
          banner_type = 'jewelry-collections-overview'

          schemas = {}
          for stype in custom_types:
              path = Path('sections') / f'{stype}.liquid'
              assert path.exists(), path
              text = path.read_text(encoding='utf-8')
              assert '{% schema %}' in text and '{% endschema %}' in text, stype
              schema_text = text.split('{% schema %}', 1)[1].split('{% endschema %}', 1)[0].strip()
              schema = json.loads(schema_text)
              schemas[stype] = schema

              settings = {s.get('id'): s for s in schema.get('settings', []) if isinstance(s, dict) and s.get('id')}

              if stype not in no_heading_required and 'heading_size' in settings:
                  if stype == banner_type:
                      assert settings['heading_size']['default'] != 35
                  else:
                      assert settings['heading_size']['default'] == 35, (stype, settings['heading_size']['default'])

              if stype not in {'jewelry-collections-overview'}:
                  if 'heading_size' in settings:
                      assert settings['heading_size'].get('step') == 1, stype

              # All user-facing custom sections except hidden legacy compatibility component use reveal motion.
              if stype != 'icon-text-list':
                  assert 'animation_style' in settings, (stype, 'missing animation_style')

          # Explicit image-hover cleanup. Only image-gallery is allowed to evolve with gallery hover behavior.
          image_cards = Path('sections/image-cards.liquid').read_text(encoding='utf-8')
          assert 'hover_overlay_opacity' not in image_cards
          assert '.ca-image-card:hover .ca-image-card__image' not in image_cards
          assert 'scale(1.04)' not in image_cards

          collection_grid = Path('sections/image-collection-grid.liquid').read_text(encoding='utf-8')
          assert 'hover_overlay_opacity' not in collection_grid
          assert 'ca-hover-overlay' not in collection_grid
          assert '.ca-collection__card:is(:hover, :focus-visible) .ca-collection__image' not in collection_grid
          assert 'ca-collection__outline' not in collection_grid

          process_cards = Path('sections/process-cards.liquid').read_text(encoding='utf-8')
          assert '.ca-process-card:hover .ca-process-card__image' not in process_cards
          assert 'scale(1.03)' not in process_cards

          content_cards = Path('sections/content-cards.liquid').read_text(encoding='utf-8')
          assert 'hover_image' not in content_cards
          assert 'image--hover' not in content_cards

          # Validate every instance of our custom section types in all JSON templates
          # against the current schema, including unknown IDs and range/select constraints.
          errors = []

          for template_path in Path('templates').glob('*.json'):
              raw = template_path.read_text(encoding='utf-8')
              data = json.loads(raw[raw.index('{'):])

              for sid, sec in data.get('sections', {}).items():
                  stype = sec.get('type')
                  if stype not in custom_types:
                      continue

                  schema = schemas[stype]
                  setting_defs = {
                      s.get('id'): s
                      for s in schema.get('settings', [])
                      if isinstance(s, dict) and s.get('id')
                  }

                  for key, value in sec.get('settings', {}).items():
                      spec = setting_defs.get(key)
                      if spec is None:
                          errors.append(f'{template_path}:{sid}: unknown section setting {key!r} for {stype}')
                          continue

                      if spec.get('type') == 'range' and isinstance(value, (int, float)):
                          lo, hi, step = spec['min'], spec['max'], spec['step']
                          if value < lo or value > hi:
                              errors.append(f'{template_path}:{sid}.{key}={value} outside {lo}..{hi}')
                          else:
                              q = (value - lo) / step
                              if abs(q - round(q)) > 1e-9:
                                  errors.append(f'{template_path}:{sid}.{key}={value} not aligned to step {step} from min {lo}')

                      elif spec.get('type') == 'select':
                          allowed = {o['value'] for o in spec.get('options', [])}
                          if value not in allowed:
                              errors.append(f'{template_path}:{sid}.{key}={value!r} not in {sorted(allowed)}')

                  block_defs = {
                      b['type']: {
                          s.get('id'): s
                          for s in b.get('settings', [])
                          if isinstance(s, dict) and s.get('id')
                      }
                      for b in schema.get('blocks', [])
                      if isinstance(b, dict) and b.get('type')
                  }

                  for bid, block in sec.get('blocks', {}).items():
                      btype = block.get('type')
                      defs = block_defs.get(btype)
                      if defs is None:
                          errors.append(f'{template_path}:{sid}.{bid}: unknown block type {btype!r} for {stype}')
                          continue

                      for key, value in block.get('settings', {}).items():
                          spec = defs.get(key)
                          if spec is None:
                              errors.append(f'{template_path}:{sid}.{bid}: unknown block setting {key!r}')
                              continue

                          if spec.get('type') == 'range' and isinstance(value, (int, float)):
                              lo, hi, step = spec['min'], spec['max'], spec['step']
                              if value < lo or value > hi:
                                  errors.append(f'{template_path}:{sid}.{bid}.{key}={value} outside {lo}..{hi}')
                              else:
                                  q = (value - lo) / step
                                  if abs(q - round(q)) > 1e-9:
                                      errors.append(f'{template_path}:{sid}.{bid}.{key}={value} not aligned to step {step} from min {lo}')

                          elif spec.get('type') == 'select':
                              allowed = {o['value'] for o in spec.get('options', [])}
                              if value not in allowed:
                                  errors.append(f'{template_path}:{sid}.{bid}.{key}={value!r} not in {sorted(allowed)}')

          assert not errors, '\n'.join(errors)

          print('Craftaurum V3 section/template audit: PASS')
          PY

      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
