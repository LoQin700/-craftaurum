name: Validate Festival Jewelry Page

on:
  push:
    branches:
      - feature/festival-jewelry-page

permissions:
  contents: read
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Festival Jewelry template
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          text=Path('templates/page.festival-jewelry.json').read_text(encoding='utf-8')
          page=json.loads(text[text.index('{'):])

          expected=[
            'main',
            'festival_intro',
            'christmas',
            'halloween_intro',
            'halloween_products',
            'thanksgiving',
            'black_friday',
            'black_friday_products',
            'why_choose',
            'custom_options',
            'contact'
          ]
          assert page['order']==expected

          assert page['sections']['festival_intro']['type']=='festival-intro'
          assert page['sections']['christmas']['type']=='image-text-feature'
          assert page['sections']['halloween_intro']['type']=='image-text-feature'
          assert page['sections']['halloween_products']['type']=='content-cards'
          assert page['sections']['thanksgiving']['type']=='image-text-feature'
          assert page['sections']['black_friday']['type']=='image-text-feature'
          assert page['sections']['black_friday_products']['type']=='content-cards'
          assert page['sections']['why_choose']['type']=='why-choose-craftaurum'
          assert page['sections']['custom_options']['type']=='content-cards'
          assert page['sections']['contact']['type']=='editorial-contact'

          # All visible section headings follow the 35px standard.
          for sid in expected:
              sec=page['sections'][sid]
              if sid=='main':
                  continue
              if 'heading_size' in sec.get('settings',{}):
                  assert sec['settings']['heading_size']==35,(sid,sec['settings']['heading_size'])

          assert len(page['sections']['halloween_products']['block_order'])==4
          assert len(page['sections']['black_friday_products']['block_order'])==5
          assert len(page['sections']['why_choose']['block_order'])==4
          assert len(page['sections']['custom_options']['block_order'])==6

          refs=[]
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if k in ('image','hero_image') and isinstance(v,str) and v:
                          refs.append(v)
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(page)

          assert refs
          bad=[r for r in refs if not r.startswith('shopify://shop_images/')]
          assert not bad,bad

          intro=Path('sections/festival-intro.liquid').read_text(encoding='utf-8')
          schema=json.loads(intro.split('{% schema %}',1)[1].split('{% endschema %}',1)[0].strip())
          heading=next(x for x in schema['settings'] if x.get('id')=='heading_size')
          assert heading['default']==35
          assert heading['step']==1

          print('Festival Jewelry template: PASS')
          print('Image refs:',len(refs))
          PY

      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
