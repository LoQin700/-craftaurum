name: Validate Theme Motion

on:
  push:
    branches:
      - fix/enable-theme-motion

permissions:
  contents: read
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate motion settings and reveal script
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          raw=Path('config/settings_data.json').read_text(encoding='utf-8')
          data=json.loads(raw[raw.index('{'):])
          current=data['current']
          assert current['page_transition_enabled'] is True
          assert current['transition_to_main_product'] is True

          js=Path('assets/craftaurum-reveal.js').read_text(encoding='utf-8')
          assert 'element.animate' in js
          assert 'duration: 780' in js
          assert 'play(element, 180)' in js
          assert "shopify:section:select" in js
          assert "shopify:section:load" in js
          assert 'prefers-reduced-motion: reduce' in js

          print('Theme motion validation: PASS')
          PY

      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
