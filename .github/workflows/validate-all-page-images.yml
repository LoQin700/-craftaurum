name: Validate All Page Images

on:
  push:
    branches:
      - content/assign-all-page-images

permissions:
  contents: read
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate image assignments
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              'templates/index.json',
              'templates/page.customization.json',
              'templates/page.jewelry-rings.json',
              'templates/page.jewelry-earrings.json',
              'templates/page.jewelry-bracelets.json',
              'templates/page.jewelry-necklace.json',
              'templates/page.jewelry-fashion.json',
              'templates/page.jewelry-artisanal.json',
              'templates/page.jewelry-collections.json',
              'templates/page.oem-jewellery.json',
          ]

          minimum_refs = {
              'templates/index.json': 12,
              'templates/page.customization.json': 15,
              'templates/page.jewelry-rings.json': 10,
              'templates/page.jewelry-earrings.json': 10,
              'templates/page.jewelry-bracelets.json': 10,
              'templates/page.jewelry-necklace.json': 10,
              'templates/page.jewelry-fashion.json': 10,
              'templates/page.jewelry-artisanal.json': 10,
              'templates/page.jewelry-collections.json': 13,
              'templates/page.oem-jewellery.json': 14,
          }

          total = 0
          for file in files:
              text = Path(file).read_text(encoding='utf-8')
              data = json.loads(text[text.index('{'):])
              refs = []

              def walk(x):
                  if isinstance(x, dict):
                      for k, v in x.items():
                          if k in ('image','hero_image','image_1','image_1_mobile','hover_image') and isinstance(v, str) and v:
                              refs.append(v)
                          walk(v)
                  elif isinstance(x, list):
                      for v in x:
                          walk(v)

              walk(data)
              bad = [r for r in refs if not r.startswith('shopify://shop_images/')]
              assert not bad, (file, bad)
              assert len(refs) >= minimum_refs[file], (file, len(refs), minimum_refs[file])
              print(file, len(refs))
              total += len(refs)

          print('TOTAL IMAGE REFERENCES:', total)
          PY

      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
