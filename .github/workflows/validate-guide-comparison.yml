name: Validate Guide And Comparison

on:
  push:
    branches:
      - refactor/guide-controls-mobile-comparison

permissions:
  contents: read
  checks: write

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate template structure
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          text = Path('templates/page.solid-gold.json').read_text(encoding='utf-8')
          page = json.loads(text[text.index('{'):])
          guide = page['sections']['indexed_guide']
          compare = page['sections']['comparison_table']
          assert guide['type'] == 'content-guide'
          assert guide['settings']['intro_alignment'] == 'center'
          assert guide['settings']['heading_size'] == 42
          assert compare['type'] == 'comparison-table'
          assert compare['settings']['intro_alignment'] == 'center'
          assert compare['settings']['cell_padding'] == 20
          print('Guide/comparison template structure: PASS')
          PY
      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
