name: Validate Equal Height Triptych

on:
  push:
    branches:
      - refactor/silver-showcase-equal-height

permissions:
  contents: read
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate triptych template
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          text=Path('templates/page.custom-silver-jewelry.json').read_text(encoding='utf-8')
          page=json.loads(text[text.index('{'):])
          sec=page['sections']['silver_showcase_rows']

          assert sec['type']=='triptych-split-rows'
          assert sec['settings']['image_position']=='right'
          assert sec['settings']['text_background']=='#E7DED0'
          assert sec['settings']['image_background']=='#F6F2EB'
          assert len(sec['block_order'])==4

          for bid in sec['block_order']:
              block=sec['blocks'][bid]
              assert block['type']=='row'
              for key in ['image_1','image_2','image_3']:
                  assert block['settings'][key].startswith('shopify://shop_images/')
          print('Equal height triptych template: PASS')
          PY

      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          flags: '--fail-level error'
          token: ${{ github.token }}
          base: main
